name: Auto update from upstream

# این فایل همراه قالب به کلون خصوصی هر خریدار منتقل می‌شود و ریپوی خریدار
# را خودکار با نسخه جدید قالب همگام می‌کند؛ push حاصل باعث redeploy خودکار
# در پلتفرم متصل (Cloudflare/Vercel/...) می‌شود.
#
# قالب حالا عمومی (public) است: کلون‌های خریدار بدون هیچ سکرتی sync می‌شوند.
# فقط اگر قالب دوباره خصوصی شد، در هر ریپوی خریدار سکرت UPSTREAM_PAT بگذارید
# (PAT با دسترسی contents:read روی ریپوی قالب) — در این حالت خودکار استفاده می‌شود.
#
# تریگرها: روزانه ۰۳:۰۰ UTC — یا فوری با دستور
#   npm run release  (اسکریپت repository_dispatch برای همه خریداران)

on:
  schedule:
    - cron: "0 3 * * *"
  repository_dispatch:
    types: [template-update]
  workflow_dispatch:

env:
  # مسیر ریپوی خصوصی قالب — کلون‌های خریدار از همین آدرس sync می‌شوند.
  # در خودِ این ریپو، شرط if پایین باعث می‌شود job اجرا نشود.
  UPSTREAM_REPO: ardijon/insurance-recruit-template

permissions:
  contents: write

jobs:
  sync:
    # `env` context is NOT available in a job-level `if` — hard-code the
    # upstream path here so this job skips inside the template repo itself.
    if: github.repository != 'ardijon/insurance-recruit-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        env:
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          git config user.name "update-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$UPSTREAM_PAT" ]; then
            echo "UPSTREAM_PAT موجود است — sync خصوصی با توکن انجام می‌شود"
            git remote add upstream "https://x-access-token:${UPSTREAM_PAT}@github.com/${UPSTREAM_REPO}.git"
          else
            echo "sync عمومی (بدون توکن) از ${UPSTREAM_REPO}"
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch upstream main --tags --force
          if git merge --ff-only "upstream/main"; then
            git push origin HEAD
            echo "ریپوی خریدار با موفقیت به‌روزرسانی شد"
          else
            echo "::error::merge سریع ممکن نیست (تغییرات محلی در ریپوی خریدار) — آپدیت دستی لازم است"
            exit 1
          fi
