name: Deploy buyer site to Cloudflare

# این workflow همراه قالب به هر ریپوی خریدار منتقل می‌شود و سایت همان خریدار
# را روی حساب Cloudflare فروشنده دیپلوی می‌کند.
# در خودِ ریپوی قالب اجرا نمی‌شود (شرط if پایین).
#
# سکرت‌های لازم در ریپوی خریدار (توسط scripts/provision-client.sh تنظیم می‌شوند):
#   CLOUDFLARE_API_TOKEN  — توکن Cloudflare فروشنده (Workers + D1)
#   CLOUDFLARE_ACCOUNT_ID — شناسه حساب Cloudflare فروشنده
# بدون این سکرت‌ها، job با خطای واضح fail می‌شود (نه سکوت).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # `env` context is NOT available in a job-level `if` — hard-code the
    # upstream path here so this job skips inside the template repo itself.
    if: github.repository != 'ardijon/insurance-recruit-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::سکرت‌های CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID تنظیم نشده‌اند — دیپلوی خودکار غیرفعال است"
            exit 1
          fi
          npx @opennextjs/cloudflare build
          npx wrangler deploy --config ./wrangler.toml
