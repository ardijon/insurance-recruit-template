name = "insurance-recruit-template"
main = ".open-next/worker.js"
compatibility_date = "2025-08-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
DEMO_MODE = "true"
DEMO_OPEN_ADMIN = "true"

[build]
# فقط در دیپلوی دمو (OBFUSCATE_DEMO=1 از scripts/deploy-demo.mjs) مبهم‌سازی
# اجرا می‌شود؛ دیپلوی خریداران همان build استاندارد را می‌گیرند.
command = "npx @opennextjs/cloudflare build && node scripts/obfuscate-demo.mjs"
